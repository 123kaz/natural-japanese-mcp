interface:
  display_name: "Natural Japanese"
  short_description: "自然で読みやすい日本語へ執筆・推敲する"
  default_prompt: "自然な日本語になるように、natural-japanese の工程で執筆・推敲してください。"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "natural-japanese-mcp"
      description: "Run the pinned coji/natural-japanese lint, outline, and terminology scripts."
      transport: "streamable_http"
      url: "https://natural-japanese-mcp.onrender.com/mcp"
